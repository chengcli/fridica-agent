[package]
name = "fridica-agent"
version = "0.4.5"
edition = "2021"
rust-version = "1.88"
description = "Drive Claude Code (stream-json) and Codex (app-server) sessions: approvals, interrupts, resume and structured results"
license = "MIT"
repository = "https://github.com/chengcli/fridica-agent"
readme = "README.md"
keywords = ["claude", "codex", "agent", "llm", "automation"]
categories = ["api-bindings", "asynchronous", "development-tools"]

[features]
default = []
overleaf = ["dep:anyhow", "dep:interleaf"]
scix = ["dep:anyhow", "dep:rmcp", "tokio/process"]
alphaxiv = ["dep:anyhow", "dep:rmcp", "dep:reqwest", "tokio/io-std"]
github = ["dep:anyhow", "dep:octocrab", "dep:gix", "dep:base64", "dep:percent-encoding", "tokio/io-std", "tokio/process"]

[[bin]]
name = "fridica-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "fridica-agent-alphaxiv"
path = "src/bin/alphaxiv.rs"
required-features = ["alphaxiv"]

[[bin]]
name = "fridica-agent-scix"
path = "src/bin/scix.rs"
required-features = ["scix"]

[[bin]]
name = "fridica-agent-overleaf"
path = "src/bin/overleaf.rs"
required-features = ["overleaf"]

[dependencies]
rmcp = { version = "3.10", default-features = false, features = ["client", "server", "transport-io", "transport-streamable-http-client-reqwest"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"], optional = true }
anyhow = { version = "1", optional = true }
interleaf = { version = "0.4.0", optional = true }
octocrab = { version = "0.54", default-features = false, features = ["default-client", "rustls", "rustls-ring", "rustls-webpki-tokio", "timeout"], optional = true }
gix = { version = "0.90", default-features = false, features = ["sha1"], optional = true }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
